name: acceptance_screen
out: results/runs
note: 'Acceptance-check screen (pre-registration a689890): xfedga_plus + ga.acceptance_check, protocols {''breast'': ''v1'', ''prostate_ms'': ''v2''}, validation only, no test.'
runs:
- task: breast
  method: xfedga_plus
  seed: 1
  set:
  - evaluation.log_wagg_val=true
  - evaluation.log_client_val=true
  - ga.acceptance_check=true
  no_test: true
  tag: accscreen
- task: prostate_ms
  method: xfedga_plus
  seed: 1
  set:
  - fitness.subsample=120
  - train.local_epochs=2
  - preprocessing.fov_crop_mm=110
  - preprocessing.intensity=zscore
  - evaluation.log_wagg_val=true
  - evaluation.log_client_val=true
  - ga.acceptance_check=true
  no_test: true
  tag: accscreen
- task: breast
  method: xfedga_plus
  seed: 2
  set:
  - evaluation.log_wagg_val=true
  - evaluation.log_client_val=true
  - ga.acceptance_check=true
  no_test: true
  tag: accscreen
- task: prostate_ms
  method: xfedga_plus
  seed: 2
  set:
  - fitness.subsample=120
  - train.local_epochs=2
  - preprocessing.fov_crop_mm=110
  - preprocessing.intensity=zscore
  - evaluation.log_wagg_val=true
  - evaluation.log_client_val=true
  - ga.acceptance_check=true
  no_test: true
  tag: accscreen
