# Client -> dataset mapping for the breast lesion segmentation task.
# Fill in local paths once you download/unzip each dataset.

task: breast_lesion_segmentation
image_size: [384, 384]
channels: 1  # grayscale

clients:
  # Training clients only -- the server-designated hospital below is
  # EXCLUDED from this list; it never participates in local training.
  - id: client_1
    name: BUSI
    path: "raw data/BUSI"
    kaggle: "aryashah2k/breast-ultrasound-images-dataset"
    notes: "confirmed: benign/malignant/normal subfolders, filename (n)_mask.png"

  - id: client_2
    name: BUS-UCLM
    path: "raw data/BUS-UCLM"
    kaggle: "orvile/bus-uclm-breast-ultrasound-dataset"
    notes: "confirmed: images/ + masks/ with identical filenames (e.g. ALWI_000.png), nested under a doubled folder name -- indexer walks the tree to find it robustly"

server:
  # BUS-BRA acts as the "server hospital": never trained on locally.
  # 50% of it is used for GA fitness evaluation (once we add the GA),
  # the other 50% is held out as a true out-of-distribution test set,
  # matching the base paper's protocol (Sec VI-E / VII-C).
  name: BUS-BRA
  path: "raw data/BUS-BRA"
  kaggle: "orvile/bus-bra-a-breast-ultrasound-dataset"
  notes: "confirmed: nested under BUSBRA/Images + BUSBRA/Masks, bus_data.csv has scanner metadata"
  fitness_split: 0.5
  seed: 42

train_val_split: 0.8
seed: 42

loader:
  # Preprocessed tensors are cached under cache/ (data/cache.py), keyed by a hash of the
  # preprocessing code, parameters and raw files.
  # num_workers: 0 -- decided 15 Oct 2026 (approved) from a measurement on the cached datasets
  # (RTX 4050 laptop, Windows): steady training epoch with 0 / 2 / 4 workers = 1.96 / 1.99 / 2.00 s
  # (PROMISE12 client 1) and 2.68 / 2.70 / 2.73 s (BUSI), i.e. no gain, because the loop is
  # GPU-bound once the cache is used; worker start-up under Windows spawn added 8-30 s per loader.
  # Workers > 0 are supported and tested (tests/test_cache.py::test_dataloader_workers_match_single_process).
  num_workers: 0
  persistent_workers: true
  pin_memory: false

# ---------------------------------------------------------------------------
# Experiment settings (loaded and validated in one place: experiments/config.py).
# The data-split seed is `seed` above; the run seed is passed per run (--seed).
train:
  rounds: 15
  local_epochs: 10
  lr: 0.001
  adam_betas: [0.9, 0.99]
  batch_size: 8

aggregation:
  beta: 0.5          # saliency-weighting exponent: alpha_i ~ (n_i/N) * max(q_i, eps)^beta
  eps: 0.001

ga:
  population: 6
  generations: 5
  pc: 0.5            # crossover probability
  pm: 0.1            # per-weight mutation probability
  sigma0: 0.01
  tau: 10.0          # annealing: sigma_g = sigma0 * exp(-g / tau) (XFedGA only)
  cache_elite_fitness: true    # decision Q7: enabled 15 Oct 2026 -- tests/test_determinism.py passed (repeatable fitness)

fitness:
  weights: [0.5, 0.3, 0.2]   # fitness weights (w1, w2, w3) on DSC, HD95_norm, EC; sum to 1
  subsample: 40              # fixed fitness subsample, shared by FedGA (baseline) and XFedGA
  # Every image and mask is resized to image_size (384 x 384) before any metric is
  # computed, so HD95 is in pixels of that grid; HD95_norm = min(HD95_px / 384, 1).
  hd95_normalizer: 384
  cam_threshold: 0.5         # EC = IoU(Grad-CAM >= threshold, mask)
  # XFedGA CAM definition (decision 17 Oct 2026, plan.md section 0.0; known-answer test):
  #   cam_layer:  fullres = full-resolution decoder up-conv | halfres = the layer of every run before 17 Oct
  #   cam_target: pred = sum of class-1 logits over the predicted foreground | all = over every pixel (before 17 Oct)
  # One definition for q_i, the EC fitness term, validation/test logging and all XAI metrics.
  cam_layer: fullres
  cam_target: pred

saliency:
  subsample: 40              # fixed q_i subsample per client (training images)

evaluation:
  explain_samples: 30        # per-round EC / pointing-game logging on a fixed validation subsample
  selection_smoothing: 3     # checkpoint = round with the best centred 3-round mean validation DSC

splits:
  # Approved 15 Oct 2026 (Q1): BUS-BRA split by PATIENT (bus_data.csv `Case`), stratified by
  # device x pathology. The legacy server.fitness_split (per-image 50/50) is not used by
  # experiments/run_federated.py.
  server_fractions: {fitness: 0.15, validation: 0.25}   # test = the remaining 60 %
  server_metadata: "raw data/BUS-BRA/BUSBRA/bus_data.csv"
  client_val_fraction: 0.2   # held out and unused (Q3); BUS-UCLM split by patient prefix

method_options:
  fedprox_mu: 0.01           # FedProx proximal weight (mu / 2) * ||w - w_global||^2 (method fedprox)

scenario:
  # Defaults = the main experiments. Robustness / heterogeneity runs override these.
  partition: random          # prostate only: random (50/50 by case) | acquisition (spacing groups, data/scenarios.py)
  acquisition_threshold_mm: 0.45
  noisy_qi_client: null      # client index (0-based) that always reports q_i = 1.0
  corrupted_label_client: null   # client index whose masks are shuffled across its own images
  dp:
    enabled: false           # client-side clip + Gaussian noise on the update (no formal guarantee claimed)
    clip_norm: 1.0           # L2 clip of w_i - w_global; to be set from measured update norms before DP runs
    noise_multiplier: 0.1    # noise std = noise_multiplier * clip_norm
