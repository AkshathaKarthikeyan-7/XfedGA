# Client -> dataset mapping for the prostate segmentation task.
# NOTE: unlike breast_clients.yaml, the two clients here are NOT loaded via
# INDEXERS -- both come from the same PROMISE12 source, split at the case
# level by split_promise12_clients() in data/prostate_dataset.py, since no
# site/institution metadata shipped with this PROMISE12 download (checked:
# no .txt/.csv/readme files present). This is a SYNTHETIC non-IID split,
# weaker non-IID grounding than the breast task's 2-real-dataset design --
# state this explicitly in the report/panel review, don't imply otherwise.

task: prostate_segmentation
image_size: [384, 384]
channels: 1

clients:
  - id: client_1
    name: PROMISE12
    path: "raw data/PROMISE12"
    notes: "random half of PROMISE12 cases (via split_promise12_clients, seed=42)"

  - id: client_2
    name: PROMISE12
    path: "raw data/PROMISE12"
    notes: "disjoint other half of PROMISE12 cases"

server:
  # Decathlon Task05_Prostate acts as the held-out server dataset: never
  # trained on locally. T2 channel only (channel 0 of the 4D volume);
  # PZ+TZ labels merged into a single binary prostate mask.
  name: Decathlon
  path: "raw data/Task05_Prostate/Task05_Prostate"
  notes: "32 cases; case-level fitness/OOD split to avoid patient leakage across sets"
  fitness_split: 0.5
  seed: 42

train_val_split: 0.8
seed: 42

loader:
  # Preprocessed tensors are cached under cache/ (data/cache.py), keyed by a hash of the
  # preprocessing code, parameters and raw files. num_workers: 0 is the measured optimum
  # with the cache (see data/loading.py); workers > 0 are supported on Windows.
  num_workers: 0
  persistent_workers: true
  pin_memory: false

# ---------------------------------------------------------------------------
# Experiment settings (loaded and validated in one place: experiments/config.py).
# The data-split seed is `seed` above; the run seed is passed per run (--seed).
train:
  rounds: 15
  local_epochs: 10
  lr: 0.001
  adam_betas: [0.9, 0.99]
  batch_size: 8

aggregation:
  beta: 0.5          # saliency-weighting exponent: alpha_i ~ (n_i/N) * max(q_i, eps)^beta
  eps: 0.001

ga:
  population: 6
  generations: 5
  pc: 0.5            # crossover probability
  pm: 0.1            # per-weight mutation probability
  sigma0: 0.01
  tau: 10.0          # annealing: sigma_g = sigma0 * exp(-g / tau) (XFedGA only)
  cache_elite_fitness: true    # decision Q7: enabled 15 Oct 2026 -- tests/test_determinism.py passed (repeatable fitness)

fitness:
  weights: [0.5, 0.3, 0.2]   # fitness weights (w1, w2, w3) on DSC, HD95_norm, EC; sum to 1
  subsample: 40              # fixed fitness subsample, shared by FedGA (baseline) and XFedGA
  # Every image and mask is resized to image_size (384 x 384) before any metric is
  # computed, so HD95 is in pixels of that grid; HD95_norm = min(HD95_px / 384, 1).
  hd95_normalizer: 384
  cam_threshold: 0.5         # EC = IoU(Grad-CAM >= threshold, mask)

saliency:
  subsample: 40              # fixed q_i subsample per client (training images)

evaluation:
  explain_samples: 30        # per-round EC / pointing-game logging on a fixed validation subsample
  selection_smoothing: 3     # checkpoint = round with the best centred 3-round mean validation DSC

splits:
  # Approved 15 Oct 2026 (Q1): Decathlon cases 8 / 8 / 16, in blocks of 4 cases of similar
  # gland size (non-empty slice count), each block giving 1 fitness, 1 validation, 2 test.
  server_block_roles: [fitness, validation, test, test]
