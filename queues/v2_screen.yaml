name: v2_screen
out: results/runs
note: 'Protocol v2 VALIDATION-ONLY screen (plan.md pre-registration 18 Oct 2026, commit 661a173): FedGA (baseline) + XFedGA, 2 tasks x seeds 1-2, no test evaluation. Compared with v1 headline seeds 1-2
  by analysis/v2_adoption.py.'
runs:
